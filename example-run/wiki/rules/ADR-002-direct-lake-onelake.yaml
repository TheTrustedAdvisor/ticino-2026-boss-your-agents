id: ADR-002
title: ADR-002 Direct Lake on OneLake for the Sales model
status: accepted
decided_by: the session
decision: >-
  The Sales model uses Direct Lake on OneLake: a shared AzureStorage.DataLake expression on the lakehouse's
  OneLake URL, referenced by one directLake partition per table. Direct Lake on OneLake never falls back to
  DirectQuery and supports semantic-model RLS; Direct Lake on SQL risks fallback and Import is ruled out by the
  request.
page: adr-002-direct-lake-on-onelake-for-the-sales-model.md
sources:
  - https://learn.microsoft.com/fabric/fundamentals/direct-lake-overview#comparison-of-storage-modes
  - https://learn.microsoft.com/fabric/fundamentals/direct-lake-develop#direct-lake-model-metadata
check:
  storage_mode: direct_lake_onelake
