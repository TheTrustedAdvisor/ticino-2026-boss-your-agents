id: ADR-001
title: ADR-001 Lakehouse without schemas, loaded through OneLake
status: accepted
decided_by: the session
decision: >-
  The lakehouse is created without schemas (default dbo). The CSVs are uploaded to Files/raw/ and written as
  Delta tables customers and orders by pyarrow directly to OneLake (load-table --engine onelake), because the
  Spark-based Load Table API is slow and throttled on F2 and two tables gain nothing from schemas.
page: adr-001-lakehouse-without-schemas-loaded-through-onelake.md
sources:
  - https://learn.microsoft.com/rest/api/fabric/lakehouse/tables/load-table
  - https://learn.microsoft.com/fabric/fundamentals/direct-lake-overview
check:
  lakehouse_schemas: false
