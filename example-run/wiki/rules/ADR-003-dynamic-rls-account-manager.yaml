id: ADR-003
title: ADR-003 Dynamic RLS per account manager, members from the tenant only
status: accepted
decided_by: the session
decision: >-
  One role, Account Manager (read), filters Customers[Account Manager] = USERPRINCIPALNAME(), and the filter
  reaches Orders through the single-direction Customers to Orders relationship, so every account manager sees
  only their own customers. Only users or groups of the tenant become role members; at delivery that is
  viewer@contoso.example, and the non-tenant managers wait for Sales Ops to provide
  real UPNs.
page: adr-003-dynamic-rls-per-account-manager-members-from-the-tenant-.md
sources:
  - https://learn.microsoft.com/fabric/security/service-admin-row-level-security
  - https://learn.microsoft.com/fabric/security/service-admin-row-level-security#considerations-and-limitations-for-dynamic-rls
  - https://learn.microsoft.com/fabric/fundamentals/direct-lake-security-integration#data-access-rule-options
check:
  rls:
    table_with_columns: [Account Manager]
    filter_contains: USERPRINCIPALNAME()
    min_members: 1
