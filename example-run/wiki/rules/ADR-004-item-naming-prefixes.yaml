id: ADR-004
title: ADR-004 Item naming convention with type prefixes
status: accepted
decided_by: Matthias Falland
decision: >-
  Items use type prefixes lh_, sm_, rpt_, nb_, lower case, underscores, so anyone can tell an item's type from
  its name. Decided by the project owner on 2026-10-27 in answer to Q-1; it applies from the next delivery, so
  the existing SalesLakehouse and Sales do not comply yet.
page: adr-004-item-naming-convention-with-type-prefixes.md
sources:
  - https://learn.microsoft.com/power-bi/guidance/powerbi-implementation-planning-workspaces-tenant-level-planning#workspace-naming-conventions
check:
  item_names:
    Lakehouse: '^lh_[a-z0-9_]+$'
    SemanticModel: '^sm_[a-z0-9_]+$'
    Report: '^rpt_[a-z0-9_]+$'
    Notebook: '^nb_[a-z0-9_]+$'
